# Pile de dev P5.1 : PostgreSQL + Redis + service paiement. `docker compose up --build`.
# Swagger UI : http://localhost:8080/swagger-ui.html — Actuator : http://localhost:8080/actuator/health
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masante_payment
      POSTGRES_USER: payment
      # Micro-lot B4 : plus aucun secret en clair ici. `${VAR:?}` fait ÉCHOUER le démarrage si
      # la variable manque — un secret absent doit s'entendre, pas se remplacer par du vide.
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?absent de services/payment/.env (voir .env.example)}
    ports:
      - "5433:5432"
    volumes:
      - payment_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d masante_payment"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment:
    build: .
    image: masante-payment:test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      # Permet au paiement d'atteindre le fraud-detection-service (pile séparée, port publié 8090).
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/masante_payment
      DB_USER: payment
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?absent de services/payment/.env (voir .env.example)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # B1 — routage d'alerte : le paiement appelle le fraud-detection-service pour scorer (ADR-020).
      MASANTE_PAYMENT_FRAUDE_BASE_URL: http://host.docker.internal:8090
      # Lot 6 — canal interne : notification signée vers le backend Laravel à chaque issue de paiement.
      LARAVEL_BASE_URL: http://host.docker.internal:8000
      # Secrets applicatifs (P5.5b-1, lot 6). Lus depuis `.env` (gitignoré) — jamais versionnés.
      # En prod : KMS + masante.payment.securite.exiger-cles=true (démarrage refusé si absents).
      MASANTE_PAYMENT_DEST_KEY: ${MASANTE_PAYMENT_DEST_KEY:?absent de services/payment/.env}
      MASANTE_PAYMENT_DEST_PEPPER: ${MASANTE_PAYMENT_DEST_PEPPER:?absent de services/payment/.env}
      MASANTE_PAYMENT_PRINCIPAL_SECRET: ${MASANTE_PAYMENT_PRINCIPAL_SECRET:?absent de services/payment/.env}
      # Lot 7 — GeniusPay. La base est une URL, pas un secret, mais son absence doit s'entendre :
      # elle est tranchée par la verification V1 et ne s'ecrit jamais en dur dans le code.
      GENIUSPAY_BASE_URL: ${GENIUSPAY_BASE_URL:?absent de services/payment/.env (voir .env.example)}
    ports:
      - "8080:8080"

volumes:
  payment_pg:
