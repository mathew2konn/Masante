# Pile de dev P5.1 : PostgreSQL + Redis + service paiement. `docker compose up --build`.
# Swagger UI : http://localhost:8080/swagger-ui.html — Actuator : http://localhost:8080/actuator/health
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masante_payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5433:5432"
    volumes:
      - payment_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d masante_payment"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  payment:
    build: .
    image: masante-payment:test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/masante_payment
      DB_USER: payment
      DB_PASSWORD: payment
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"

volumes:
  payment_pg:
