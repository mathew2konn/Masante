server:
  port: 8080

spring:
  application:
    name: masante-payment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/masante_payment}
    username: ${DB_USER:payment}
    password: ${DB_PASSWORD:payment}
  jpa:
    hibernate:
      ddl-auto: none        # le schéma est la propriété de Flyway, jamais d'Hibernate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

masante:
  payment:
    # TTL du verrou d'idempotence (Redis) : au-delà, seule la contrainte d'unicité PG protège.
    idempotency-lock-seconds: 30
    # Canal interne vers le backend Laravel (lot 6). Le SECRET n'est PAS ici : c'est le même
    # MASANTE_PAYMENT_PRINCIPAL_SECRET que la vérification entrante, jamais un second.
    canal-interne:
      principal-sub: ${CANAL_INTERNE_PRINCIPAL_SUB:paiement-service}
      principal-roles: ${CANAL_INTERNE_PRINCIPAL_ROLES:SYSTEME}
    laravel:
      base-url: ${LARAVEL_BASE_URL:http://host.docker.internal:8000}
      # Un client sans délai attend indéfiniment, et c'est le relais entier qui se bloquerait
      # sur une seule ligne d'outbox.
      timeout-connexion-s: ${LARAVEL_TIMEOUT_CONNEXION_S:5}
      timeout-lecture-s: ${LARAVEL_TIMEOUT_LECTURE_S:10}
    signature:
      # Signature RSA-SHA256 des factures/avoirs (§7.4). Clé de DÉV en mémoire (substitut HSM/KMS).
      # « Prête à activer » : ON par défaut ici ; l'adossement HSM/PKI réelle est l'étape ultérieure.
      enabled: ${SIGNATURE_ENABLED:true}
    # Sécurité Wallet (P5.3b-1, CDC_06 §6.4). TOUTES ces valeurs sont des DONNÉES (jamais codées) :
    # les plafonds/seuils par défaut sont surchargeables par portefeuille (table wallet_limites).
    wallet:
      pin:
        max-essais: ${WALLET_PIN_MAX_ESSAIS:3}       # verrou temporaire au-delà
        verrou-minutes: ${WALLET_PIN_VERROU_MINUTES:15}
      otp:
        seuil: ${WALLET_OTP_SEUIL:100000}            # OTP exigé au-delà de ce montant (FCFA)
        ttl-seconds: ${WALLET_OTP_TTL:300}
      limites:
        operation: ${WALLET_LIMITE_OPERATION:500000} # plafond par opération
        jour: ${WALLET_LIMITE_JOUR:1000000}          # plafond cumulé / jour
        mois: ${WALLET_LIMITE_MOIS:5000000}          # plafond cumulé / mois
      # Détection de fraude par règles (P5.3b-2, §6.4). Seuils/poids = DONNÉES. Trois paliers :
      # alerte (l'op passe) < challenge (re-auth OTP) < gel (bloque + gèle). Défauts prudents
      # (contexte santé : ne pas bloquer un paiement d'hospitalisation légitime) ; surchargeables.
      fraude:
        velocite:
          fenetre-secondes: ${WALLET_FRAUDE_VELOCITE_FENETRE:60}
          max-operations: ${WALLET_FRAUDE_VELOCITE_MAX:10}
        montant:
          fenetre-secondes: ${WALLET_FRAUDE_CUMUL_FENETRE:3600}
          max-cumule: ${WALLET_FRAUDE_CUMUL_MAX:5000000}
        pin:
          fenetre-secondes: ${WALLET_FRAUDE_PIN_FENETRE:3600}
          echecs-recents-max: ${WALLET_FRAUDE_PIN_MAX:5}
        poids:
          velocite: ${WALLET_FRAUDE_POIDS_VELOCITE:50}
          cumul: ${WALLET_FRAUDE_POIDS_CUMUL:30}
          pin: ${WALLET_FRAUDE_POIDS_PIN:30}
        seuil-alerte: ${WALLET_FRAUDE_SEUIL_ALERTE:30}
        seuil-challenge: ${WALLET_FRAUDE_SEUIL_CHALLENGE:50}
        seuil-gel: ${WALLET_FRAUDE_SEUIL_GEL:80}
        gel-ttl-heures: ${WALLET_FRAUDE_GEL_TTL_H:24}
      # Cashback (P5.3b-3). Le CRÉDIT est GATÉ OFF par défaut (prêt à activer §11 : le chemin de
      # remboursement wallet doit appeler le clawback en même tx avant d'activer). OFF = dry-run.
      cashback:
        credit-enabled: ${WALLET_CASHBACK_CREDIT_ENABLED:false}
    # Contrôle d'intégrité financière interne (P5.3b-4, CDC_06 §6.3). Lecture seule ; détection seule.
    # Ce n'est PAS un rapprochement à deux sources (S11.x / ADR-014). Horaire = DONNÉE.
    integrite:
      planification:
        enabled: ${INTEGRITE_PLANIF_ENABLED:true}
        cron: ${INTEGRITE_PLANIF_CRON:0 30 1 * * *}   # tous les jours 01:30 UTC (contrôle la veille)
      # Endpoint d'injection d'anomalies : DÉV UNIQUEMENT. OFF en production (l'endpoint répond 404).
      dev-seed-enabled: ${INTEGRITE_DEV_SEED:false}
    # Jobs planifiés du domaine carte (P5.4a, CDC_06 §5/§6.3, ADR-015). Horaires/activation = DONNÉES.
    cartes:
      # Durée de vie du nonce anti-rejeu des webhooks (> fenêtre de fraîcheur 5 min).
      webhook-nonce-minutes: ${CARTE_WEBHOOK_NONCE_MINUTES:15}
      planification:
        enabled: ${CARTE_PLANIF_ENABLED:true}
        expiration-defi-ms: ${CARTE_EXPIRATION_DEFI_MS:60000}                       # défis/redirections échus → EXPIREE (~1 min)
        expiration-autorisation-cron: ${CARTE_EXPIRATION_AUTORISATION_CRON:0 15 1 * * *}  # 01:15 UTC
        reconciliation-cron: ${CARTE_RECONCILIATION_CRON:0 45 1 * * *}              # 01:45 UTC (réconcilie la veille)
    # Reversements aux établissements (P5.5, CDC_06 §11). Décaissement SIMULÉ (FT5).
    reversement:
      # Rapprochement à DEUX sources « factures ↔ reversements » (P5.5c, ADR-014/ADR-016). VRAI
      # rapprochement (facturation ⇄ reversements), pas l'auditeur interne. Détection seule.
      rapprochement:
        # Délai de grâce (jours) : une facture soldée depuis moins longtemps n'est pas encore signalée
        # « non reversée » (le relevé périodique n'a pas forcément tourné). DONNÉE, jamais codée.
        delai-grace-jours: ${REVERSEMENT_RAPPROCHEMENT_GRACE_JOURS:2}
        planification:
          enabled: ${REVERSEMENT_RAPPROCHEMENT_PLANIF_ENABLED:true}
          cron: ${REVERSEMENT_RAPPROCHEMENT_CRON:0 0 2 * * *}   # tous les jours 02:00 UTC (rapproche la veille)
        # Endpoint d'injection d'anomalies : DÉV UNIQUEMENT. OFF en production (l'endpoint répond 404).
        dev-seed-enabled: ${REVERSEMENT_RAPPROCHEMENT_DEV_SEED:false}
    # GeniusPay (lot 7, ADR-044). Montage A : un compte marchand PAR ÉTABLISSEMENT.
    # SANDBOX UNIQUEMENT (D7) : toute autre valeur fait ÉCHOUER le démarrage, elle n'est pas ignorée.
    geniuspay:
      environnement: ${GENIUSPAY_ENVIRONNEMENT:sandbox}
      # Aucune valeur par défaut : une base absente doit s'entendre au démarrage, jamais se remplacer
      # par une URL devinée. Retenue par la vérification V1 (les deux bases répondent 200 → geniuspay.ci).
      base-url: ${GENIUSPAY_BASE_URL}
      timeout-connexion-ms: ${GENIUSPAY_TIMEOUT_CONNEXION_MS:5000}
      timeout-lecture-ms: ${GENIUSPAY_TIMEOUT_LECTURE_MS:15000}
      # Minimum imposé par GeniusPay (contrainte du prestataire, pas une règle MaSanté).
      montant-minimum: ${GENIUSPAY_MONTANT_MINIMUM:200}
      # Fenêtre de fraîcheur de l'horodatage signé du webhook (anti-rejeu).
      fenetre-antirejeu-secondes: ${GENIUSPAY_FENETRE_ANTIREJEU_S:300}
      # Délai au-delà duquel une transaction INITIEE_INCERTAINE est soumise au balayage (§7.4.b).
      levee-incertitude-minutes: ${GENIUSPAY_LEVEE_INCERTITUDE_MIN:15}
      # Plafond de consultations unitaires par exécution du balayage — le coût est réel (une requête
      # par candidat), il se borne par une donnée, jamais par une constante de code.
      balayage-max-consultations: ${GENIUSPAY_BALAYAGE_MAX:200}
      # Au-delà, une transaction jamais confirmée est déclarée échue. AUCUNE facture n'est soldée sur
      # une hypothèse : c'est l'inverse qui se produit (remise à la charge du partenaire).
      abandon-apres-heures: ${GENIUSPAY_ABANDON_APRES_H:24}
      # Retours applicatifs. Ils N'AUTHENTIFIENT RIEN (D5) : seul le webhook fait foi. Optionnels.
      success-url: ${GENIUSPAY_SUCCESS_URL:}
      error-url: ${GENIUSPAY_ERROR_URL:}
      planification:
        enabled: ${GENIUSPAY_PLANIF_ENABLED:true}
        # Traitement des événements webhook reçus : le contrôleur ENREGISTRE et rend la main, le
        # relais applique. Même motif que l'Outbox de notification (P5.4c) — aucun @Async ajouté.
        traitement-evenements-ms: ${GENIUSPAY_TRAITEMENT_EVENEMENTS_MS:5000}
        reconciliation-ms: ${GENIUSPAY_RECONCILIATION_MS:600000}   # 10 min (§8.5)
    # Plancher métier du paiement EN LIGNE (R17/R5b) : sous ce montant, le paiement sur place reste
    # la voie normale. DONNÉE, jamais codée en dur.
    plancher-en-ligne-fcfa: ${PAIEMENT_PLANCHER_EN_LIGNE:5000}
    # Libellé transmis au prestataire. GÉNÉRIQUE et CONSTANT : aucun acte, aucune spécialité, aucun
    # service hospitalier ne sort du service (interdiction n°7).
    libelle-generique: ${PAIEMENT_LIBELLE_GENERIQUE:Règlement MaSanté}
