// services/payment — microservice Paiement MASANTÉ (CDC_06, ADR-013).
// Build/run canonique via Docker (voir Dockerfile + docker-compose.yml) : JDK 21 embarqué,
// aucune dépendance à la chaîne d'outils de l'hôte. `--release 21` garantit un bytecode stable.
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'ci.masante'
version = '0.1.0'
description = 'MASANTÉ Payment Service (P5.1 — socle + prise en charge CNAM/assurance)'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Facturation (P5.2) : génération PDF (OpenPDF, LGPL/MPL) + QR Code (ZXing, Apache-2.0).
    // Tout est local : aucun appel réseau, aucun secret. Approuvé par le propriétaire (§2.6).
    implementation 'com.github.librepdf:openpdf:1.3.35'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.google.zxing:javase:3.5.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Seul le jar exécutable Spring Boot est produit (pas de -plain.jar ambigu pour le Dockerfile).
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}
