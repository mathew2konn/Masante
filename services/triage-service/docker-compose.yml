# Pile de dev — triage-service (CDC_05 §5.5.4, socle P10c-2-i). `docker compose up --build`.
# Swagger : http://localhost:8095/docs — Santé : http://localhost:8095/ready
# SANS ÉTAT (ni Postgres ni Redis) — comme fraud-detection (ADR-017), et pour la même raison :
# Laravel orchestre et persiste, ce service reste passif. Purement ENTRANT : Laravel l'appelle,
# il n'appelle personne (pas d'extra_hosts nécessaire).
services:
  triage-service:
    build: .
    image: masante-triage-service:test
    ports:
      - "8095:8095"
